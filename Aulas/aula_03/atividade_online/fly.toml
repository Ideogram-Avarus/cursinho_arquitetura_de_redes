# Use os scripts scripts/subir-aula.ps1 e scripts/derrubar-aula.ps1: o app existe só durante a aula.
# Troque "atividade-redes-aula03" por um nome livre no Fly.io (vira https://<nome>.fly.dev).
app = "atividade-redes-aula03"
primary_region = "gru" # São Paulo: menor latência para a turma

[build]

[env]
  NODE_ENV = "production"
  PORT = "3000"
  HOST = "0.0.0.0"
  # Sem volume: o banco fica dentro da máquina e nasce vazio a cada subida.
  # Se a máquina reiniciar, importe o último JSON em /professor/dados.
  DATABASE_URL = "file:./prisma/aula.db"
  LOG_PRETTY = "true" # logs legíveis no `fly logs` (bom para projetar)

[http_service]
  internal_port = 3000
  force_https = true
  # A máquina fica ligada enquanto o app existir. Não use auto-stop: sem volume,
  # uma máquina que para e volta perde o banco no meio da aula.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/status"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
